[package]
name = "flydex"
version = "0.1.0"
description = "Flydex - A cross-platform desktop AI coding agent"
authors = ["Flydex"]
edition = "2021"

[lib]
name = "flydex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
dirs = "5"
tauri-plugin-dialog = "2.7.2"
# PTY 伪终端：给 codex 挂 TTY 强制流式输出（Windows conpty / macOS & Linux pty）
portable-pty = "0.8"
# 模型连接测试
ureq = { version = "2", features = ["json"] }
# 读取 ~/.codex/config.toml 继承已配置的供应商
toml = "0.8"
serde_yaml = "0.9"
# 图像附件：base64 解码落盘
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
