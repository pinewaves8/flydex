name: test

# 只在 push / PR 时跑。
#
# **刻意不放进 pre-commit 钩子**:flydex 自己每轮对话结束都会对被操作的项目
# `git add -A && git commit`(见 src-tauri/src/services/git_checkpoint.rs),而
# git commit 必然触发钩子 —— 那会让测试跑在代理的热路径上,更要命的是:提交失败时
# checkpoint 直接 `return None`,不重试也不提示,「每轮自动快照」会**静默失效**。
# CI 只在 push 时跑,正好绕开这条路径。

on:
  push:
  pull_request:

# 同一分支连续 push 时,取消还在跑的旧任务(省额度,也避免看到过期的结果)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端(类型 / 测试 / 构建)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与本地一致。package.json 里没有 packageManager 字段,
          # 不显式指定的话 runner 上拿到的版本可能和本地差一截。
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 三步分开,失败时一眼能看出是类型、测试还是打包的问题
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust(单元测试)
    # 跑在 windows 上而不是 ubuntu:Tauri 在 Linux 需要额外装
    # webkit2gtk/libappindicator 等系统库,而本项目本就是 Windows 目标
    # (路径处理里有 verbatim 前缀等 Windows 专属逻辑)。跑在真实目标平台上,
    # 少一层"CI 过了但本地不过"的可能。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri 依赖树很大,不缓存的话每次都要冷编几分钟
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `dist/` 是前端产物,被 gitignore —— 但 `tauri::generate_context!()` 在
      # **编译期**就要求 frontendDist 存在,否则直接 proc macro panic:
      #   The `frontendDist` configuration is set to `"../dist"` but this path doesn't exist
      # lib 的单元测试不会真的实例化 App,所以建个空目录就够(已本地验证:
      # 空 dist 下 89 个测试全过)。不在这里跑前端构建 —— 那是上面那个 job 的事,
      # 重复一遍只会让 Rust job 慢一大截。
      - name: 建占位 dist(Tauri 编译期需要)
        run: mkdir -p ../dist
        shell: bash

      # 只跑 lib 的单元测试(不构建桌面应用),这正是本地那条命令
      #
      # TEMP:失败时把关键行发成注解 —— 定位这个 job 首次失败的根因用的。
      # 起因是 GitHub 的日志接口需要仓库管理权限,匿名拿不到,而注解可以。
      # 查清原因后这一步应改回朴素的 `cargo test --lib`。
      #
      # 上一版只 grep 了 `error` 开头的行,结果一条都没抓到 —— 说明**不是编译错误**,
      # 而是测试失败(那类输出是 `test result: FAILED` / `panicked at`)。所以这一版
      # 抓测试失败的签名,并把输出尾部一并带上兜底。
      - name: cargo test --lib
        shell: bash
        run: |
          set -o pipefail
          if cargo test --lib 2>&1 | tee /tmp/ci.out; then
            exit 0
          fi
          echo "::error::cargo test 失败;行数=$(wc -l < /tmp/ci.out)"
          grep -nE "test result|FAILED|panicked|assertion|^failures:|^---- |thread '" /tmp/ci.out \
            | head -40 | while IFS= read -r l; do echo "::error::SIG $l"; done
          echo "::error::---- 输出尾部 ----"
          tail -40 /tmp/ci.out | while IFS= read -r l; do echo "::error::TAIL $l"; done
          exit 1
